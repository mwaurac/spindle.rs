[workspace]
resolver = "3"
members = [
  "crates/spindle-core",
  "crates/spindle-py"
]
default-members = [
  "crates/spindle-core"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal ML framework for inference"
keywords = ["tensor", "machine-learning", "artificial-intelligence"]

[workspace.dependencies]
spindle-core = { path = "crates/spindle-core"}
